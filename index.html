<!doctype html>
<html lang="en" data-root="../">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f6fb">
  <title>Admin dashboard — Kage Apps</title><link rel="stylesheet" href="../css/style.css">
  <script defer src="../js/database.js"></script><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="../js/supabase-config.js"></script><script defer src="../js/supabase.js"></script><script defer src="../js/auth.js"></script><script defer src="../js/admin-dashboard.js"></script>
</head>
<body data-root="../" data-requires-admin="true">
  <header class="site-header admin-site-header"><a class="brand" href="../index.html"><span class="brand-mark">K</span><span>Kage Apps <span class="admin-word">Admin</span></span></a><div class="header-actions"><a class="button button-outline" href="users.html">Users</a><a class="button button-outline" href="catalog.html">Edit catalog</a><button class="button button-outline" type="button" data-signout>Log out</button><button class="icon-button theme-toggle" type="button" aria-label="Switch color theme" title="Switch theme"><span class="theme-glyph">◐</span></button></div></header>
  <main class="page-wrap admin-main"><div class="admin-page-heading"><div><p class="eyebrow">PRIVATE ADMIN AREA</p><h1>Dashboard</h1><p class="auth-lead">Overview of registered users and app downloads.</p></div><a class="text-link" href="users.html">View users <span aria-hidden="true">→</span></a></div>
    <div class="auth-message" data-auth-status role="status" hidden></div>
    <section data-admin-content hidden><div class="admin-stat-grid"><article class="admin-stat-card"><span>Registered users</span><strong id="admin-user-count">—</strong><small>profiles in Supabase</small></article><article class="admin-stat-card"><span>Total downloads</span><strong id="admin-download-count">—</strong><small>recorded app downloads</small></article></div>
      <div class="admin-content-grid"><section class="profile-panel"><div class="section-heading"><div><p class="eyebrow">RECENT SIGNUPS</p><h2>New users</h2></div><a class="text-link" href="users.html">See all</a></div><div id="admin-recent-users" class="admin-activity-list"><p class="loading-card">Loading…</p></div></section>
      <section class="profile-panel"><div class="section-heading"><div><p class="eyebrow">LATEST ACTIVITY</p><h2>Recent downloads</h2></div></div><div id="admin-recent-downloads" class="admin-activity-list"><p class="loading-card">Loading…</p></div></section></div>
    </section>
  </main>
</body>
</html>
