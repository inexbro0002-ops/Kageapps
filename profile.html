<!doctype html>
<html lang="en" data-root="./">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f6fb">
  <title>Your profile — Kage Apps</title><link rel="stylesheet" href="css/style.css">
  <script defer src="js/database.js"></script><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="js/supabase-config.js"></script><script defer src="js/supabase.js"></script><script defer src="js/auth.js"></script><script defer src="js/profile.js"></script>
</head>
<body data-root="./" data-requires-auth="true">
  <header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">K</span><span>Kage Apps</span></a><nav class="main-nav"><a class="nav-link" href="index.html">Discover</a><a class="nav-link" href="search.html">All apps</a></nav><div class="header-actions"><a class="button button-outline account-settings-link" href="settings.html">Settings</a><button class="button button-outline" type="button" data-signout>Log out</button><button class="icon-button theme-toggle" type="button" aria-label="Switch color theme" title="Switch theme"><span class="theme-glyph">◐</span></button></div></header>
  <main class="page-wrap profile-main"><p class="eyebrow">YOUR ACCOUNT</p><h1>Your profile</h1><div class="auth-message" data-auth-status hidden></div>
    <section class="profile-summary" data-profile-content hidden><div class="profile-avatar" id="profile-avatar"><span id="profile-initial">K</span><img id="profile-avatar-image" alt="" hidden></div><div class="profile-summary-copy"><h2 id="profile-username">Loading profile…</h2><p id="profile-email" class="auth-lead"></p><p class="profile-meta">Member since <span id="profile-created">—</span></p></div><div class="profile-stat"><strong id="download-count">0</strong><span>App downloads</span></div></section>
    <section class="profile-grid" data-profile-content hidden><div class="profile-panel"><div class="section-heading"><div><p class="eyebrow">ACCOUNT DETAILS</p><h2>Edit profile</h2></div></div><div class="auth-message" data-form-message hidden></div><form id="profile-form"><div class="form-field"><label for="profile-edit-username">Username</label><input id="profile-edit-username" type="text" name="username" autocomplete="nickname" required minlength="1" maxlength="40"></div><div class="form-field"><label for="profile-edit-avatar">Profile picture URL</label><input id="profile-edit-avatar" type="url" name="avatar_url" placeholder="https://example.com/avatar.png"><small>Optional HTTPS image URL.</small></div><button class="button button-dark" type="submit">Save changes</button></form></div>
      <div class="profile-panel"><div class="section-heading"><div><p class="eyebrow">YOUR ACTIVITY</p><h2>Recent downloads</h2></div></div><div id="recent-downloads" class="history-list"><p class="loading-card">Loading downloads…</p></div><a class="text-link" href="search.html">Find more apps <span aria-hidden="true">→</span></a></div></section>
  </main>
  <footer class="site-footer"><div class="page-wrap footer-inner"><a class="brand footer-brand" href="index.html"><span class="brand-mark">K</span><span>Kage Apps</span></a><p>Apps, without the noise.</p><a href="index.html" class="footer-admin">Browse apps</a></div></footer>
</body>
</html>
