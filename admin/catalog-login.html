<!doctype html>
<html lang="en" data-root="../">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f6fb">
  <title>Catalog editor sign in — Kage Apps</title><link rel="stylesheet" href="../css/style.css">
  <script defer src="../js/database.js"></script><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="../js/supabase-config.js"></script><script defer src="../js/supabase.js"></script><script defer src="../js/auth.js"></script>
</head>
<body data-root="../" data-auth-page="login" data-default-next="admin/catalog.html">
  <main class="auth-shell"><div class="auth-topbar"><a class="brand auth-brand" href="../index.html"><span class="brand-mark">K</span><span>Kage Apps</span></a><button class="icon-button theme-toggle" type="button" aria-label="Switch color theme" title="Switch theme"><span class="theme-glyph">◐</span></button></div>
    <section class="auth-card"><p class="eyebrow">AUTHORIZED ACCESS</p><h1 id="auth-title">Catalog editor sign in</h1><p class="auth-lead" id="auth-lead">Sign in with your Supabase administrator account.</p><div class="auth-message" data-auth-status hidden></div>
      <form data-auth-form="login" id="login-form" novalidate><div class="auth-message" data-form-message role="status" hidden></div><div class="form-field"><label for="admin-email">Email</label><input id="admin-email" type="email" name="email" autocomplete="email" required></div><div class="form-field"><label for="admin-password">Password</label><input id="admin-password" type="password" name="password" autocomplete="current-password" required></div><label class="form-check remember-check"><input type="checkbox" name="remember" checked><span>Remember this device</span></label><button class="button button-dark" type="submit">Sign in <span aria-hidden="true">→</span></button><div class="auth-links"><a href="../login.html?mode=recovery">Forgot password?</a><a href="../index.html">Back to apps</a></div></form>
      <p class="auth-switch">Dashboard: <a href="index.html">Open admin dashboard</a></p>
    </section><a class="auth-back" href="../index.html">← Back to apps</a>
  </main>
</body>
</html>
